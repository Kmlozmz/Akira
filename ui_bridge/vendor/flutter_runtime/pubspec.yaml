name: inotes_recovered
description: Versioned local evaluation runtime; see the integration provenance manifest.
publish_to: none
version: 0.0.1
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.8'
dependencies:
  flutter:
    sdk: flutter
flutter:
  fonts:
    - family: InotesPretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
  shaders:
    - shaders/bar_blur_mip_structured.frag
    - shaders/glass_lean_structured.frag
    - shaders/glass_lean_lens_structured.frag
    - shaders/glass_lean_morph_structured.frag
    - shaders/glass_mip_structured.frag
    - shaders/pocket_blur_structured.frag
    - shaders/press_glow_structured.frag
    - shaders/text_loupe_structured.frag
